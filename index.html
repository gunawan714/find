<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>👶 SafeTrack - Pantau Lokasi Anak</title>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --coral: #FF6B6B;
            --teal: #4ECDC4;
            --sunny: #FFE66D;
            --mint: #A8E6CF;
            --peach: #FF8A5C;
            --purple: #6C5CE7;
            --pink: #FD79A8;
            --sky: #74B9FF;
            --dark: #2D3436;
            --gray: #636E72;
            --light-gray: #DFE6E9;
            --white: #FFFFFF;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.10);
            --shadow-hover: 0 12px 48px rgba(0, 0, 0, 0.16);
            --radius: 24px;
            --radius-sm: 14px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(145deg, #FFF9F0 0%, #F8F0FF 100%);
            min-height: 100vh;
            padding: 14px;
            padding-bottom: 90px;
            color: var(--dark);
            -webkit-font-smoothing: antialiased;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--light-gray);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--teal);
            border-radius: 10px;
        }

        /* ===== APP CONTAINER ===== */
        #app {
            max-width: 480px;
            margin: 0 auto;
            position: relative;
        }

        /* ===== HEADER ===== */
        .app-header {
            background: linear-gradient(135deg, var(--purple), var(--pink));
            padding: 18px 22px 16px;
            border-radius: var(--radius);
            margin-bottom: 18px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .app-header::before {
            content: '✨';
            position: absolute;
            top: -14px;
            right: -8px;
            font-size: 72px;
            opacity: 0.13;
            transform: rotate(18deg);
        }

        .app-header::after {
            content: '🌟';
            position: absolute;
            bottom: -18px;
            left: -8px;
            font-size: 56px;
            opacity: 0.11;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-icon {
            font-size: 30px;
            animation: bounce 2s infinite;
            line-height: 1;
        }

        @keyframes bounce {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--white);
            letter-spacing: -0.2px;
        }

        .header-title span {
            font-weight: 400;
            opacity: 0.85;
        }

        .header-badge {
            background: rgba(255, 255, 255, 0.20);
            backdrop-filter: blur(4px);
            padding: 3px 12px;
            border-radius: 30px;
            color: var(--white);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.4px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .header-sub {
            color: rgba(255, 255, 255, 0.92);
            font-size: 12px;
            font-weight: 400;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .header-sub i {
            font-size: 11px;
            opacity: 0.8;
        }

        /* ===== PHONE INPUT CARD ===== */
        .input-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 14px 16px;
            box-shadow: var(--shadow);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition);
            border: 2px solid transparent;
            flex-wrap: wrap;
        }

        .input-card:focus-within {
            border-color: var(--teal);
            box-shadow: var(--shadow-hover);
        }

        .input-card .icon-wrap {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--sunny), var(--peach));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 16px;
            flex-shrink: 0;
        }

        .input-card input {
            flex: 1;
            border: none;
            outline: none;
            font-family: 'Quicksand', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: var(--dark);
            background: transparent;
            padding: 6px 0;
            min-width: 100px;
        }

        .input-card input::placeholder {
            color: var(--gray);
            font-weight: 400;
            font-size: 13px;
        }

        .input-card .btn-track {
            background: linear-gradient(135deg, var(--teal), #45B7AA);
            border: none;
            color: var(--white);
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 13px;
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(78, 205, 196, 0.30);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-card .btn-track:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 20px rgba(78, 205, 196, 0.40);
        }

        .input-card .btn-track:active {
            transform: scale(0.95);
        }

        .input-card .btn-track:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== STATUS BAR ===== */
        .status-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 8px;
            margin-bottom: 14px;
        }

        .status-item {
            background: var(--white);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition);
            border-left: 4px solid var(--teal);
        }

        .status-item .stat-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .status-item .stat-icon.green {
            background: #E8F8F5;
            color: #1ABC9C;
        }
        .status-item .stat-icon.orange {
            background: #FEF5E7;
            color: #F39C12;
        }
        .status-item .stat-icon.purple {
            background: #F4ECF7;
            color: #8E44AD;
        }
        .status-item .stat-icon.blue {
            background: #EBF5FB;
            color: #3498DB;
        }
        .status-item .stat-icon.pink {
            background: #FDEDEC;
            color: #E74C3C;
        }

        .status-item .stat-info {
            flex: 1;
            min-width: 0;
        }

        .status-item .stat-label {
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--gray);
        }

        .status-item .stat-value {
            font-size: 13px;
            font-weight: 700;
            color: var(--dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-item .stat-value .highlight {
            color: var(--teal);
        }

        /* ===== MAP ===== */
        .map-wrapper {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 14px;
            position: relative;
            height: 320px;
            border: 2px solid rgba(78, 205, 196, 0.12);
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            padding: 5px 14px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 600;
            color: var(--gray);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .map-overlay .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #2ECC71;
            animation: pulse-dot 1.6s infinite;
        }

        .map-overlay .dot.inactive {
            background: #bdc3c7;
            animation: none;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.6);
            }
        }

        /* ===== LOCATION DETAILS ===== */
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 14px;
        }

        .detail-card {
            background: var(--white);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            transition: var(--transition);
        }

        .detail-card .label {
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--gray);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .detail-card .value {
            font-size: 14px;
            font-weight: 700;
            margin-top: 3px;
            color: var(--dark);
            word-break: break-all;
            line-height: 1.3;
        }

        .detail-card .value .small {
            font-size: 11px;
            font-weight: 400;
            color: var(--gray);
        }

        .detail-card.accent-coral {
            border-left: 3px solid var(--coral);
        }
        .detail-card.accent-teal {
            border-left: 3px solid var(--teal);
        }
        .detail-card.accent-sunny {
            border-left: 3px solid var(--sunny);
        }
        .detail-card.accent-purple {
            border-left: 3px solid var(--purple);
        }

        /* ===== HISTORY ===== */
        .history-section {
            background: var(--white);
            border-radius: var(--radius);
            padding: 14px 16px;
            box-shadow: var(--shadow);
            margin-bottom: 14px;
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .history-header .left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .history-header h3 {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .history-header h3 i {
            color: var(--teal);
        }

        .history-header .count {
            background: var(--light-gray);
            padding: 1px 10px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            color: var(--gray);
        }

        .history-header .btn-clear {
            background: transparent;
            border: none;
            color: var(--coral);
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 20px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .history-header .btn-clear:hover {
            background: #FDEDEC;
        }

        .history-header .btn-clear:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .history-list {
            max-height: 170px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #FAFAFA;
            border-radius: 10px;
            font-size: 12px;
            transition: var(--transition);
            border-left: 3px solid var(--teal);
            gap: 6px;
            flex-wrap: wrap;
        }

        .history-item .h-time {
            font-weight: 600;
            color: var(--dark);
            font-size: 11px;
            white-space: nowrap;
        }

        .history-item .h-coord {
            color: var(--gray);
            font-size: 11px;
            font-weight: 500;
            flex: 1;
            min-width: 80px;
        }

        .history-item .h-status {
            font-size: 13px;
        }

        .history-empty {
            text-align: center;
            padding: 20px 0;
            color: var(--gray);
            font-size: 13px;
        }

        .history-empty i {
            font-size: 28px;
            display: block;
            margin-bottom: 6px;
            opacity: 0.4;
        }

        /* ===== CONTROLS ===== */
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 2px;
        }

        .controls .btn {
            flex: 1;
            min-width: 90px;
            padding: 12px 14px;
            border: none;
            border-radius: 30px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.07);
        }

        .controls .btn:active {
            transform: scale(0.95);
        }

        .controls .btn-primary {
            background: linear-gradient(135deg, var(--teal), #45B7AA);
            color: var(--white);
            box-shadow: 0 4px 16px rgba(78, 205, 196, 0.30);
        }

        .controls .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(78, 205, 196, 0.40);
        }

        .controls .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .controls .btn-danger {
            background: linear-gradient(135deg, var(--coral), #E74C3C);
            color: var(--white);
            box-shadow: 0 4px 16px rgba(255, 107, 107, 0.30);
        }

        .controls .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(255, 107, 107, 0.40);
        }

        .controls .btn-danger:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .controls .btn-outline {
            background: var(--white);
            color: var(--dark);
            border: 2px solid var(--light-gray);
        }

        .controls .btn-outline:hover {
            border-color: var(--teal);
            background: #F8FFFE;
        }

        .controls .btn-outline:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ===== FOOTER ===== */
        .app-footer {
            text-align: center;
            padding: 16px 0 4px;
            font-size: 11px;
            color: var(--gray);
            opacity: 0.6;
        }

        .app-footer i {
            color: var(--coral);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--dark);
            color: var(--white);
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.20);
            opacity: 0;
            transition: var(--transition);
            pointer-events: none;
            z-index: 999;
            max-width: 92%;
            text-align: center;
            line-height: 1.4;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: #1ABC9C;
        }
        .toast.error {
            background: var(--coral);
        }
        .toast.warning {
            background: #F39C12;
        }
        .toast.info {
            background: #3498DB;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 420px) {
            body {
                padding: 10px;
                padding-bottom: 76px;
            }

            .header-title {
                font-size: 17px;
            }
            .header-badge {
                font-size: 9px;
                padding: 2px 10px;
            }
            .header-icon {
                font-size: 26px;
            }
            .input-card {
                padding: 12px 14px;
                gap: 8px;
            }
            .input-card input {
                font-size: 14px;
                min-width: 80px;
            }
            .input-card .btn-track {
                font-size: 12px;
                padding: 7px 14px;
                width: 100%;
            }
            .detail-grid {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
            .detail-card .value {
                font-size: 12px;
            }
            .status-item {
                padding: 8px 10px;
            }
            .status-item .stat-value {
                font-size: 11px;
            }
            .map-wrapper {
                height: 240px;
            }
            .controls .btn {
                font-size: 12px;
                padding: 10px 12px;
                min-width: 70px;
            }
            .history-item {
                font-size: 11px;
                padding: 6px 10px;
            }
        }

        @media (max-width: 360px) {
            .detail-grid {
                grid-template-columns: 1fr;
            }
            .status-bar {
                grid-template-columns: 1fr 1fr;
            }
            .controls .btn {
                width: 100%;
                flex: none;
            }
            .input-card {
                flex-direction: column;
            }
            .input-card input {
                width: 100%;
                text-align: center;
            }
            .input-card .btn-track {
                width: 100%;
                justify-content: center;
            }
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeInUp 0.45s ease forwards;
        }

        .delay-1 {
            animation-delay: 0.05s;
        }
        .delay-2 {
            animation-delay: 0.10s;
        }
        .delay-3 {
            animation-delay: 0.15s;
        }
        .delay-4 {
            animation-delay: 0.20s;
        }
        .delay-5 {
            animation-delay: 0.25s;
        }
        .delay-6 {
            animation-delay: 0.30s;
        }

        /* ===== SPINNER ===== */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2.5px solid rgba(255, 255, 255, 0.30);
            border-radius: 50%;
            border-top-color: var(--white);
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .spinner-dark {
            border-color: rgba(0, 0, 0, 0.15);
            border-top-color: var(--dark);
        }

        /* ===== MAP RESPONSIVE LANDSCAPE ===== */
        @media (orientation: landscape) and (max-height: 500px) {
            .map-wrapper {
                height: 180px;
            }
        }
    </style>
</head>

<body>
    <div id="app">

        <!-- ===== HEADER ===== -->
        <header class="app-header animate-in">
            <div class="header-top">
                <div class="header-left">
                    <span class="header-icon">👶</span>
                    <h1 class="header-title">Safe<span>Track</span></h1>
                </div>
                <span class="header-badge"><i class="fas fa-shield-alt"></i> &nbsp;Aman</span>
            </div>
            <div class="header-sub">
                <i class="fas fa-map-pin"></i> Pantau lokasi anak secara real-time &bull; <i class="fas fa-lock"></i> Privasi terjaga
            </div>
        </header>

        <!-- ===== PHONE INPUT ===== -->
        <div class="input-card animate-in delay-1">
            <div class="icon-wrap">
                <i class="fas fa-phone-alt"></i>
            </div>
            <input type="tel" id="phoneInput" placeholder="Masukkan nomor HP anak" maxlength="15" autocomplete="tel" />
            <button class="btn-track" id="trackBtn">
                <i class="fas fa-search"></i> Lacak
            </button>
        </div>

        <!-- ===== STATUS BAR ===== -->
        <div class="status-bar animate-in delay-2">
            <div class="status-item">
                <div class="stat-icon green"><i class="fas fa-wifi"></i></div>
                <div class="stat-info">
                    <div class="stat-label">Provider</div>
                    <div class="stat-value" id="providerDisplay">—</div>
                </div>
            </div>
            <div class="status-item">
                <div class="stat-icon purple"><i class="fas fa-microchip"></i></div>
                <div class="stat-info">
                    <div class="stat-label">IMEI</div>
                    <div class="stat-value" id="imeiDisplay">—</div>
                </div>
            </div>
            <div class="status-item">
                <div class="stat-icon blue"><i class="fas fa-satellite-dish"></i></div>
                <div class="stat-info">
                    <div class="stat-label">Status</div>
                    <div class="stat-value" id="statusDisplay">
                        <span class="highlight">● Siap</span>
                    </div>
                </div>
            </div>
            <div class="status-item">
                <div class="stat-icon orange"><i class="fas fa-phone"></i></div>
                <div class="stat-info">
                    <div class="stat-label">Nomor HP</div>
                    <div class="stat-value" id="phoneDisplay">—</div>
                </div>
            </div>
        </div>

        <!-- ===== MAP ===== -->
        <div class="map-wrapper animate-in delay-3">
            <div id="map"></div>
            <div class="map-overlay">
                <span class="dot" id="mapDot"></span>
                <span id="mapStatus">Lokasi real-time</span>
            </div>
        </div>

        <!-- ===== LOCATION DETAILS ===== -->
        <div class="detail-grid animate-in delay-4">
            <div class="detail-card accent-coral">
                <div class="label"><i class="fas fa-arrow-up"></i> Latitude</div>
                <div class="value" id="latDisplay">—</div>
            </div>
            <div class="detail-card accent-teal">
                <div class="label"><i class="fas fa-arrow-right"></i> Longitude</div>
                <div class="value" id="lngDisplay">—</div>
            </div>
            <div class="detail-card accent-sunny">
                <div class="label"><i class="fas fa-bullseye"></i> Akurasi</div>
                <div class="value" id="accDisplay">—</div>
            </div>
            <div class="detail-card accent-purple">
                <div class="label"><i class="fas fa-clock"></i> Terakhir</div>
                <div class="value" id="timeDisplay">—</div>
            </div>
        </div>

        <!-- ===== HISTORY ===== -->
        <div class="history-section animate-in delay-5">
            <div class="history-header">
                <div class="left">
                    <h3><i class="fas fa-history"></i> Riwayat Lokasi</h3>
                    <span class="count" id="historyCount">0</span>
                </div>
                <button class="btn-clear" id="clearHistoryBtn" disabled>
                    <i class="fas fa-trash-alt"></i> Hapus
                </button>
            </div>
            <div class="history-list" id="historyList">
                <div class="history-empty">
                    <i class="fas fa-map-marker-alt"></i>
                    Belum ada riwayat. Mulai pantau untuk mencatat lokasi.
                </div>
            </div>
        </div>

        <!-- ===== CONTROLS ===== -->
        <div class="controls animate-in delay-6">
            <button class="btn btn-primary" id="startBtn">
                <i class="fas fa-play"></i> Mulai
            </button>
            <button class="btn btn-danger" id="stopBtn" disabled>
                <i class="fas fa-stop"></i> Henti
            </button>
            <button class="btn btn-outline" id="refreshBtn" disabled>
                <i class="fas fa-sync-alt"></i> Segarkan
            </button>
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="app-footer">
            <i class="fas fa-heart"></i> SafeTrack &bull; Lindungi buah hati Anda
        </div>

        <!-- ===== TOAST ===== -->
        <div class="toast" id="toast"></div>
    </div>

    <script>
        // ================================================================
        //  SAFETRACK — FULL APPLICATION LOGIC v2.0
        //  Expert review & enhancement by UI/UX & Programming Specialist
        // ================================================================

        (function() {
            'use strict';

            // ---- DOM refs ----
            const phoneInput = document.getElementById('phoneInput');
            const trackBtn = document.getElementById('trackBtn');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const refreshBtn = document.getElementById('refreshBtn');
            const clearHistoryBtn = document.getElementById('clearHistoryBtn');
            const providerDisplay = document.getElementById('providerDisplay');
            const imeiDisplay = document.getElementById('imeiDisplay');
            const phoneDisplay = document.getElementById('phoneDisplay');
            const statusDisplay = document.getElementById('statusDisplay');
            const latDisplay = document.getElementById('latDisplay');
            const lngDisplay = document.getElementById('lngDisplay');
            const accDisplay = document.getElementById('accDisplay');
            const timeDisplay = document.getElementById('timeDisplay');
            const historyList = document.getElementById('historyList');
            const historyCount = document.getElementById('historyCount');
            const mapStatus = document.getElementById('mapStatus');
            const mapDot = document.getElementById('mapDot');
            const toast = document.getElementById('toast');

            // ---- State ----
            let watchId = null;
            let isTracking = false;
            let history = [];
            let currentPosition = null;
            let map = null;
            let marker = null;
            let circle = null;
            let lastPhoneNumber = '';
            let isFirstFix = true;

            // ---- Mock data (simulasi provider & IMEI) ----
            const PROVIDERS = ['Telkomsel', 'Indosat Ooredoo', 'XL Axiata', 'Smartfren', 'Three', 'By.U'];
            const IMEI_PREFIX = '35' + String(Math.floor(Math.random() * 1000000000000)).padStart(12, '0');

            function generateIMEI() {
                const base = '35' + String(Math.floor(Math.random() * 1000000000000)).padStart(12, '0');
                let sum = 0;
                let alternate = true;
                for (let i = base.length - 1; i >= 0; i--) {
                    let n = parseInt(base[i], 10);
                    if (alternate) {
                        n *= 2;
                        if (n > 9) n -= 9;
                    }
                    sum += n;
                    alternate = !alternate;
                }
                const check = (10 - (sum % 10)) % 10;
                return base + check;
            }

            const mockIMEI = generateIMEI();

            function getRandomProvider() {
                return PROVIDERS[Math.floor(Math.random() * PROVIDERS.length)];
            }

            // ---- Toast system ----
            let toastTimer = null;

            function showToast(message, type = 'info', duration = 3000) {
                if (toastTimer) {
                    clearTimeout(toastTimer);
                    toast.classList.remove('show');
                }
                toast.textContent = message;
                toast.className = 'toast';
                if (type === 'success') toast.classList.add('success');
                else if (type === 'error') toast.classList.add('error');
                else if (type === 'warning') toast.classList.add('warning');
                else toast.classList.add('info');

                void toast.offsetWidth;
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, duration);
            }

            // ---- Utilities ----
            function formatTime(ts) {
                const d = new Date(ts);
                return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            }

            function formatDate(ts) {
                const d = new Date(ts);
                return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
            }

            function formatFullTime(ts) {
                return formatDate(ts) + ' ' + formatTime(ts);
            }

            function formatCoord(v) {
                return v !== undefined && v !== null ? v.toFixed(6) : '—';
            }

            // ---- Render history ----
            function renderHistory() {
                historyCount.textContent = history.length;
                clearHistoryBtn.disabled = history.length === 0;

                if (history.length === 0) {
                    historyList.innerHTML = `
                        <div class="history-empty">
                            <i class="fas fa-map-marker-alt"></i>
                            Belum ada riwayat. Mulai pantau untuk mencatat lokasi.
                        </div>
                    `;
                    return;
                }

                let html = '';
                const reversed = [...history].reverse();
                for (const item of reversed) {
                    const statusIcon = item.acc && item.acc < 50 ? '✅' : '📍';
                    html += `
                        <div class="history-item">
                            <span class="h-time">${item.formatted}</span>
                            <span class="h-coord">${item.lat.toFixed(5)}, ${item.lng.toFixed(5)}</span>
                            <span class="h-status">${statusIcon}</span>
                        </div>
                    `;
                }
                historyList.innerHTML = html;
            }

            // ---- Add history entry ----
            function addHistory(lat, lng, acc, ts) {
                const entry = {
                    lat: lat,
                    lng: lng,
                    acc: acc,
                    time: ts,
                    formatted: formatFullTime(ts)
                };
                history.push(entry);
                if (history.length > 100) history.shift(); // batasi 100
                renderHistory();
            }

            // ---- Clear history ----
            function clearHistory() {
                if (history.length === 0) return;
                if (isTracking) {
                    showToast('⏹️ Hentikan pelacakan terlebih dahulu untuk menghapus riwayat.', 'warning', 2500);
                    return;
                }
                history = [];
                renderHistory();
                // Reset display
                latDisplay.textContent = '—';
                lngDisplay.textContent = '—';
                accDisplay.textContent = '—';
                timeDisplay.textContent = '—';
                phoneDisplay.textContent = '—';
                // Reset map marker ke default
                if (map && marker) {
                    const defaultCenter = [-6.2088, 106.8456];
                    marker.setLatLng(defaultCenter);
                    if (circle) circle.setLatLng(defaultCenter);
                    map.setView(defaultCenter, 13);
                }
                showToast('🗑️ Riwayat berhasil dihapus. Masukkan nomor baru untuk memulai.', 'success', 2000);
                lastPhoneNumber = '';
                phoneInput.value = '';
                phoneInput.focus();
                // Reset status
                statusDisplay.innerHTML = `<span class="highlight">● Siap</span>`;
                mapStatus.textContent = 'Lokasi real-time';
                mapDot.className = 'dot';
                providerDisplay.textContent = getRandomProvider();
                imeiDisplay.textContent = mockIMEI;
            }

            // ---- Update UI dengan posisi ----
            function updatePositionUI(pos) {
                if (!pos) return;
                const { latitude, longitude, accuracy } = pos.coords;
                const timestamp = pos.timestamp || Date.now();

                currentPosition = pos;

                latDisplay.textContent = formatCoord(latitude);
                lngDisplay.textContent = formatCoord(longitude);
                accDisplay.textContent = accuracy ? accuracy.toFixed(0) + ' m' : '—';
                timeDisplay.textContent = formatFullTime(timestamp);

                // Update map
                if (map && marker) {
                    const latlng = [latitude, longitude];
                    marker.setLatLng(latlng);
                    if (circle) {
                        circle.setLatLng(latlng);
                        if (accuracy && accuracy < 500) {
                            circle.setRadius(accuracy);
                        } else {
                            circle.setRadius(50);
                        }
                    }
                    map.setView(latlng, 16, { animate: true });
                }

                // Status
                statusDisplay.innerHTML = `<span style="color:#2ECC71;">● Terpantau</span>`;
                mapStatus.textContent = 'Lokasi terkini';
                mapDot.className = 'dot';

                // Tambah ke history
                addHistory(latitude, longitude, accuracy, timestamp);

                if (isFirstFix) {
                    isFirstFix = false;
                    showToast('✅ Lokasi pertama berhasil didapatkan!', 'success', 2000);
                }
            }

            // ---- Geolocation ----
            function startTracking() {
                if (isTracking) {
                    showToast('⚠️ Pelacakan sudah aktif.', 'warning', 1500);
                    return;
                }

                // Validasi nomor
                const phone = phoneInput.value.trim();
                if (!phone) {
                    showToast('📱 Masukkan nomor HP anak terlebih dahulu.', 'warning');
                    phoneInput.focus();
                    return;
                }
                if (phone.length < 6) {
                    showToast('⚠️ Nomor HP terlalu pendek (minimal 6 digit).', 'warning');
                    phoneInput.focus();
                    return;
                }

                if (!navigator.geolocation) {
                    showToast('❌ Browser tidak mendukung geolokasi. Gunakan Chrome/Android.', 'error', 4000);
                    return;
                }

                // Simpan nomor
                lastPhoneNumber = phone;
                phoneDisplay.textContent = phone;

                // Set provider & IMEI (simulasi)
                providerDisplay.textContent = getRandomProvider();
                imeiDisplay.textContent = mockIMEI;

                statusDisplay.innerHTML = `<span style="color:#F39C12;">⏳ Mengakses GPS...</span>`;
                mapStatus.textContent = 'Mencari sinyal...';
                mapDot.className = 'dot';
                isFirstFix = true;

                showToast('📡 Mengakses lokasi perangkat... Mohon izinkan akses GPS.', 'info', 2500);

                const geoOptions = {
                    enableHighAccuracy: true,
                    timeout: 18000,
                    maximumAge: 5000
                };

                watchId = navigator.geolocation.watchPosition(
                    // success
                    (pos) => {
                        updatePositionUI(pos);
                        if (!isTracking) {
                            isTracking = true;
                            updateButtons();
                            showToast('✅ Pelacakan real-time aktif!', 'success', 2000);
                        }
                    },
                    // error
                    (err) => {
                        console.error('Geolocation error:', err);
                        let msg = '❌ Gagal mengakses lokasi. ';
                        switch (err.code) {
                            case err.PERMISSION_DENIED:
                                msg += 'Izin lokasi ditolak. Aktifkan di pengaturan perangkat.';
                                break;
                            case err.POSITION_UNAVAILABLE:
                                msg += 'Sinyal GPS tidak tersedia. Coba di luar ruangan.';
                                break;
                            case err.TIMEOUT:
                                msg += 'Waktu habis. Coba lagi.';
                                break;
                            default:
                                msg += err.message || 'Error tidak diketahui.';
                        }
                        showToast(msg, 'error', 4500);
                        statusDisplay.innerHTML = `<span style="color:var(--coral);">● Gagal</span>`;
                        mapStatus.textContent = '⛔ Tidak tersedia';
                        mapDot.className = 'dot inactive';
                        stopTracking();
                    },
                    geoOptions
                );

                // Fallback timeout jika watchPosition tidak merespon dalam 10 detik
                setTimeout(() => {
                    if (!isTracking && watchId !== null) {
                        // masih mencoba, tidak melakukan apa-apa
                    }
                }, 10000);
            }

            function stopTracking() {
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }
                isTracking = false;
                updateButtons();
                statusDisplay.innerHTML = `<span style="color:var(--gray);">● Berhenti</span>`;
                mapStatus.textContent = 'Pelacakan dihentikan';
                mapDot.className = 'dot inactive';
                showToast('⏹️ Pelacakan dihentikan.', 'info', 1500);
            }

            function refreshLocation() {
                if (isTracking) {
                    showToast('🔄 Memperbarui lokasi...', 'info', 1000);
                    // restart watch untuk force refresh
                    stopTracking();
                    setTimeout(() => {
                        startTracking();
                    }, 400);
                } else {
                    showToast('⚠️ Mulai pelacakan terlebih dahulu.', 'warning');
                }
            }

            // ---- Update tombol ----
            function updateButtons() {
                if (isTracking) {
                    startBtn.disabled = true;
                    startBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Aktif`;
                    stopBtn.disabled = false;
                    trackBtn.disabled = true;
                    refreshBtn.disabled = false;
                    clearHistoryBtn.disabled = true;
                } else {
                    startBtn.disabled = false;
                    startBtn.innerHTML = `<i class="fas fa-play"></i> Mulai`;
                    stopBtn.disabled = true;
                    trackBtn.disabled = false;
                    refreshBtn.disabled = true;
                    clearHistoryBtn.disabled = history.length === 0;
                }
            }

            // ---- Inisialisasi Map ----
            function initMap() {
                const mapContainer = document.getElementById('map');
                const defaultCenter = [-6.2088, 106.8456]; // Jakarta

                map = L.map(mapContainer, {
                    center: defaultCenter,
                    zoom: 14,
                    zoomControl: false,
                    attributionControl: true
                });

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a>'
                }).addTo(map);

                // Zoom control di kanan bawah
                L.control.zoom({
                    position: 'bottomright'
                }).addTo(map);

                // Custom marker dengan emoji
                const iconHtml = `
                    <div style="
                        background: #4ECDC4;
                        width: 44px;
                        height: 44px;
                        border-radius: 50%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font-size: 24px;
                        border: 3px solid white;
                        box-shadow: 0 4px 20px rgba(78,205,196,0.50);
                        transform: translate(-50%, -50%);
                        transition: all 0.3s ease;
                    ">
                        👶
                    </div>
                `;
                const customIcon = L.divIcon({
                    html: iconHtml,
                    className: '',
                    iconSize: [44, 44],
                    iconAnchor: [22, 22]
                });

                marker = L.marker(defaultCenter, {
                    icon: customIcon,
                    draggable: false
                }).addTo(map);

                // Circle akurasi
                circle = L.circle(defaultCenter, {
                    radius: 50,
                    color: '#4ECDC4',
                    fillColor: '#4ECDC4',
                    fillOpacity: 0.15,
                    weight: 2,
                    opacity: 0.7
                }).addTo(map);

                // Klik map untuk info
                map.on('click', function(e) {
                    showToast(`📍 ${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`, 'info', 1800);
                });

                // Resize handler
                setTimeout(() => {
                    map.invalidateSize();
                }, 500);

                // Coba dapatkan posisi awal (tanpa memulai tracking penuh)
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            const { latitude, longitude } = pos.coords;
                            const latlng = [latitude, longitude];
                            map.setView(latlng, 15);
                            marker.setLatLng(latlng);
                            circle.setLatLng(latlng);
                            if (pos.coords.accuracy) {
                                circle.setRadius(pos.coords.accuracy);
                            }
                            // Tampilkan posisi tanpa menambah history
                            latDisplay.textContent = formatCoord(latitude);
                            lngDisplay.textContent = formatCoord(longitude);
                            accDisplay.textContent = pos.coords.accuracy ?
                                pos.coords.accuracy.toFixed(0) + ' m' :
                                '—';
                            timeDisplay.textContent = formatFullTime(pos.timestamp);
                            statusDisplay.innerHTML = `<span class="highlight">● Siap</span>`;
                            providerDisplay.textContent = getRandomProvider();
                            imeiDisplay.textContent = mockIMEI;
                            mapStatus.textContent = 'Posisi awal';
                            mapDot.className = 'dot';
                        },
                        () => {
                            // fallback ke default
                            showToast('📍 Gunakan default Jakarta. Aktifkan GPS untuk akurasi.', 'warning', 3000);
                            mapStatus.textContent = 'Default Jakarta';
                            mapDot.className = 'dot inactive';
                        }, { enableHighAccuracy: true, timeout: 8000 }
                    );
                }

                // Set default info
                providerDisplay.textContent = getRandomProvider();
                imeiDisplay.textContent = mockIMEI;
            }

            // ---- Event Handlers ----
            trackBtn.addEventListener('click', function() {
                const phone = phoneInput.value.trim();
                if (!phone) {
                    showToast('📱 Masukkan nomor HP anak terlebih dahulu.', 'warning');
                    phoneInput.focus();
                    return;
                }
                if (phone.length < 6) {
                    showToast('⚠️ Nomor HP tidak valid (minimal 6 digit).', 'warning');
                    phoneInput.focus();
                    return;
                }
                // Jika sudah tracking, refresh
                if (isTracking) {
                    refreshLocation();
                    return;
                }
                // Mulai tracking
                startTracking();
            });

            startBtn.addEventListener('click', startTracking);
            stopBtn.addEventListener('click', stopTracking);
            refreshBtn.addEventListener('click', refreshLocation);
            clearHistoryBtn.addEventListener('click', clearHistory);

            // Enter key pada input
            phoneInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    trackBtn.click();
                }
            });

            // ---- Inisialisasi ----
            function init() {
                initMap();
                updateButtons();
                if (!navigator.geolocation) {
                    showToast('❌ Browser tidak mendukung GPS. Gunakan Chrome/Android.', 'error', 4000);
                    statusDisplay.innerHTML = `<span style="color:var(--coral);">● Tidak didukung</span>`;
                    mapStatus.textContent = 'GPS tidak didukung';
                    mapDot.className = 'dot inactive';
                }

                // Set default IMEI & provider
                imeiDisplay.textContent = mockIMEI;
                providerDisplay.textContent = getRandomProvider();
                phoneDisplay.textContent = '—';

                console.log('👶 SafeTrack v2.0 initialized. IMEI:', mockIMEI);
                console.log('📱 Aplikasi siap digunakan untuk memantau lokasi anak.');
            }

            // ---- Run ----
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
