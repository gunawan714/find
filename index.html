<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>👶 SafeTrack — Pantau Lokasi Anak</title>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <!-- Google Fonts (Quicksand) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />

    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ============================================================
               RESET & VARIABLES
               ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --coral: #FF6B6B;
            --teal: #4ECDC4;
            --sunny: #FFE66D;
            --mint: #A8E6CF;
            --peach: #FF8A5C;
            --purple: #6C5CE7;
            --pink: #FD79A8;
            --sky: #74B9FF;
            --dark: #2D3436;
            --gray: #636E72;
            --light-gray: #DFE6E9;
            --white: #FFFFFF;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.10);
            --shadow-hover: 0 12px 48px rgba(0, 0, 0, 0.18);
            --radius: 24px;
            --radius-sm: 14px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --bg-gradient: linear-gradient(145deg, #FFF9F0 0%, #F0F4FF 100%);
        }

        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            min-height: 100dvh;
            padding: 14px;
            padding-bottom: 90px;
            color: var(--dark);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ============================================================
               SCROLLBAR (kustom)
               ============================================================ */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--light-gray);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--teal);
            border-radius: 10px;
        }

        /* ============================================================
               APP CONTAINER
               ============================================================ */
        #app {
            max-width: 480px;
            margin: 0 auto;
            position: relative;
        }

        /* ============================================================
               HEADER
               ============================================================ */
        .app-header {
            background: linear-gradient(135deg, var(--purple), var(--pink));
            padding: 18px 20px 16px;
            border-radius: var(--radius);
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .app-header::before {
            content: '✨';
            position: absolute;
            top: -8px;
            right: -6px;
            font-size: 72px;
            opacity: 0.13;
            transform: rotate(12deg);
            pointer-events: none;
        }

        .app-header::after {
            content: '🌟';
            position: absolute;
            bottom: -18px;
            left: -8px;
            font-size: 56px;
            opacity: 0.10;
            pointer-events: none;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-icon {
            font-size: 30px;
            animation: bounceHeader 2.2s infinite;
        }

        @keyframes bounceHeader {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }

        .header-title {
            font-size: 21px;
            font-weight: 700;
            color: var(--white);
            letter-spacing: -0.2px;
        }

        .header-title span {
            font-weight: 400;
            opacity: 0.85;
        }

        .header-badge {
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 4px 14px;
            border-radius: 30px;
            color: var(--white);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.4px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .header-sub {
            color: rgba(255, 255, 255, 0.92);
            font-size: 13px;
            font-weight: 400;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .header-sub i {
            font-size: 12px;
            opacity: 0.8;
        }

        /* ============================================================
               INPUT CARD (Nomor HP)
               ============================================================ */
        .input-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 14px 16px;
            box-shadow: var(--shadow);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: var(--transition);
            border: 2px solid transparent;
            flex-wrap: wrap;
        }

        .input-card:focus-within {
            border-color: var(--teal);
            box-shadow: var(--shadow-hover);
        }

        .input-card .icon-wrap {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--sunny), var(--peach));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 17px;
            flex-shrink: 0;
        }

        .input-card input {
            flex: 1;
            min-width: 120px;
            border: none;
            outline: none;
            font-family: 'Quicksand', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: var(--dark);
            background: transparent;
            padding: 6px 0;
        }

        .input-card input::placeholder {
            color: var(--gray);
            font-weight: 400;
            font-size: 14px;
        }

        .input-card .btn-track {
            background: linear-gradient(135deg, var(--teal), #3BB8B0);
            border: none;
            color: var(--white);
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 14px;
            padding: 10px 22px;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            flex-shrink: 0;
            box-shadow: 0 4px 14px rgba(78, 205, 196, 0.35);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-card .btn-track:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 22px rgba(78, 205, 196, 0.45);
        }

        .input-card .btn-track:active:not(:disabled) {
            transform: scale(0.95);
        }

        .input-card .btn-track:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ============================================================
               STATUS BAR
               ============================================================ */
        .status-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }

        .status-item {
            background: var(--white);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition);
            border-left: 4px solid var(--teal);
            min-width: 0;
        }

        .status-item .stat-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .stat-icon.green {
            background: #E8F8F5;
            color: #1ABC9C;
        }
        .stat-icon.orange {
            background: #FEF5E7;
            color: #F39C12;
        }
        .stat-icon.purple {
            background: #F4ECF7;
            color: #8E44AD;
        }
        .stat-icon.blue {
            background: #EBF5FB;
            color: #3498DB;
        }
        .stat-icon.pink {
            background: #FDEDEC;
            color: #E74C3C;
        }

        .status-item .stat-info {
            flex: 1;
            min-width: 0;
        }

        .status-item .stat-label {
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--gray);
        }

        .status-item .stat-value {
            font-size: 13px;
            font-weight: 700;
            color: var(--dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-item .stat-value .highlight {
            color: var(--teal);
        }
        .status-item .stat-value .danger {
            color: var(--coral);
        }

        /* ============================================================
               MAP
               ============================================================ */
        .map-wrapper {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 14px;
            position: relative;
            height: 320px;
            border: 2px solid rgba(78, 205, 196, 0.12);
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 5px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            color: var(--gray);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .map-overlay .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2ECC71;
            animation: pulseDot 1.6s infinite;
        }

        @keyframes pulseDot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.7);
            }
        }

        /* ============================================================
               DETAIL GRID (koordinat, akurasi, waktu)
               ============================================================ */
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .detail-card {
            background: var(--white);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            transition: var(--transition);
        }

        .detail-card .label {
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--gray);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .detail-card .value {
            font-size: 14px;
            font-weight: 700;
            margin-top: 3px;
            color: var(--dark);
            word-break: break-all;
        }

        .detail-card .value .small {
            font-size: 11px;
            font-weight: 400;
            color: var(--gray);
        }

        .detail-card.accent-coral {
            border-left: 4px solid var(--coral);
        }
        .detail-card.accent-teal {
            border-left: 4px solid var(--teal);
        }
        .detail-card.accent-sunny {
            border-left: 4px solid var(--sunny);
        }
        .detail-card.accent-purple {
            border-left: 4px solid var(--purple);
        }

        /* ============================================================
               HISTORY
               ============================================================ */
        .history-section {
            background: var(--white);
            border-radius: var(--radius);
            padding: 14px 16px;
            box-shadow: var(--shadow);
            margin-bottom: 14px;
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .history-header h3 {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .history-header h3 i {
            color: var(--teal);
        }

        .history-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-header .count {
            background: var(--light-gray);
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            color: var(--gray);
        }

        .btn-clear-history {
            background: none;
            border: none;
            color: var(--coral);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 20px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: 'Quicksand', sans-serif;
        }

        .btn-clear-history:hover {
            background: #FDEDEC;
        }

        .btn-clear-history:active {
            transform: scale(0.92);
        }

        .history-list {
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #FAFAFA;
            border-radius: 12px;
            font-size: 12px;
            transition: var(--transition);
            border-left: 3px solid var(--teal);
            gap: 6px;
            flex-wrap: wrap;
        }

        .history-item .h-time {
            font-weight: 600;
            color: var(--dark);
            font-size: 11px;
            min-width: 60px;
        }

        .history-item .h-coord {
            color: var(--gray);
            font-size: 11px;
            flex: 1;
            min-width: 80px;
        }

        .history-item .h-status {
            font-size: 13px;
        }

        .history-empty {
            text-align: center;
            padding: 20px 0 14px;
            color: var(--gray);
            font-size: 13px;
        }

        .history-empty i {
            font-size: 30px;
            display: block;
            margin-bottom: 6px;
            opacity: 0.35;
        }

        /* ============================================================
               CONTROLS
               ============================================================ */
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 2px;
        }

        .controls .btn {
            flex: 1;
            min-width: 90px;
            padding: 12px 16px;
            border: none;
            border-radius: 30px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
        }

        .controls .btn:active:not(:disabled) {
            transform: scale(0.94);
        }

        .controls .btn-primary {
            background: linear-gradient(135deg, var(--teal), #3BB8B0);
            color: var(--white);
            box-shadow: 0 4px 16px rgba(78, 205, 196, 0.30);
        }

        .controls .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(78, 205, 196, 0.40);
        }

        .controls .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .controls .btn-danger {
            background: linear-gradient(135deg, var(--coral), #E74C3C);
            color: var(--white);
            box-shadow: 0 4px 16px rgba(255, 107, 107, 0.30);
        }

        .controls .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(255, 107, 107, 0.40);
        }

        .controls .btn-danger:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .controls .btn-outline {
            background: var(--white);
            color: var(--dark);
            border: 2px solid var(--light-gray);
        }

        .controls .btn-outline:hover:not(:disabled) {
            border-color: var(--teal);
            background: #F8FFFE;
        }

        .controls .btn-outline:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ============================================================
               FOOTER
               ============================================================ */
        .app-footer {
            text-align: center;
            padding: 18px 0 6px;
            font-size: 11px;
            color: var(--gray);
            opacity: 0.65;
            letter-spacing: 0.3px;
        }

        .app-footer i {
            color: var(--coral);
        }

        /* ============================================================
               TOAST NOTIFICATION
               ============================================================ */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--dark);
            color: var(--white);
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.20);
            opacity: 0;
            transition: var(--transition);
            pointer-events: none;
            z-index: 9999;
            max-width: 92%;
            text-align: center;
            font-family: 'Quicksand', sans-serif;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: #1ABC9C;
        }
        .toast.error {
            background: var(--coral);
        }
        .toast.warning {
            background: #F39C12;
        }

        /* ============================================================
               RESPONSIVE (Mobile First)
               ============================================================ */
        @media (max-width: 420px) {
            body {
                padding: 10px;
                padding-bottom: 75px;
            }

            .header-title {
                font-size: 18px;
            }
            .header-badge {
                font-size: 9px;
                padding: 3px 10px;
            }
            .header-icon {
                font-size: 26px;
            }

            .input-card {
                padding: 12px 14px;
                gap: 10px;
            }
            .input-card input {
                font-size: 14px;
                min-width: 80px;
            }
            .input-card .btn-track {
                font-size: 13px;
                padding: 8px 16px;
                width: 100%;
                justify-content: center;
            }
            .input-card .icon-wrap {
                width: 38px;
                height: 38px;
                font-size: 15px;
            }

            .status-bar {
                grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
                gap: 7px;
            }
            .status-item {
                padding: 8px 10px;
            }
            .status-item .stat-value {
                font-size: 11px;
            }
            .status-item .stat-label {
                font-size: 8px;
            }
            .status-item .stat-icon {
                width: 28px;
                height: 28px;
                font-size: 12px;
            }

            .map-wrapper {
                height: 250px;
            }

            .detail-grid {
                grid-template-columns: 1fr 1fr;
                gap: 7px;
            }
            .detail-card {
                padding: 10px 12px;
            }
            .detail-card .value {
                font-size: 12px;
            }

            .controls .btn {
                font-size: 12px;
                padding: 10px 12px;
                min-width: 60px;
            }

            .history-item {
                font-size: 11px;
                padding: 6px 10px;
            }
            .history-item .h-time {
                font-size: 10px;
                min-width: 50px;
            }
            .history-item .h-coord {
                font-size: 10px;
            }

            .toast {
                font-size: 12px;
                padding: 10px 18px;
                bottom: 70px;
            }
        }

        @media (max-width: 360px) {
            .detail-grid {
                grid-template-columns: 1fr;
            }
            .status-bar {
                grid-template-columns: 1fr 1fr;
            }
            .controls .btn {
                width: 100%;
                flex: none;
            }
            .controls {
                flex-direction: column;
            }
            .app-header {
                padding: 14px 16px;
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .map-wrapper {
                height: 180px;
            }
            .app-header {
                padding: 12px 16px 10px;
            }
            .header-title {
                font-size: 17px;
            }
            .status-item {
                padding: 5px 10px;
            }
        }

        /* ============================================================
               ANIMATIONS
               ============================================================ */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeInUp 0.5s ease forwards;
        }

        .delay-1 {
            animation-delay: 0.05s;
        }
        .delay-2 {
            animation-delay: 0.10s;
        }
        .delay-3 {
            animation-delay: 0.15s;
        }
        .delay-4 {
            animation-delay: 0.20s;
        }
        .delay-5 {
            animation-delay: 0.25s;
        }

        /* ============================================================
               SPINNER
               ============================================================ */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.30);
            border-radius: 50%;
            border-top-color: var(--white);
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================================
               UTILITY
               ============================================================ */
        .text-ellipsis {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- ============================================================
    APP WRAPPER
    ============================================================ -->
    <div id="app">

        <!-- ===== HEADER ===== -->
        <header class="app-header animate-in">
            <div class="header-top">
                <div class="header-left">
                    <span class="header-icon" aria-hidden="true">👶</span>
                    <h1 class="header-title">Safe<span>Track</span></h1>
                </div>
                <span class="header-badge">
                    <i class="fas fa-shield-alt" aria-hidden="true"></i>
                    &nbsp;Aman
                </span>
            </div>
            <div class="header-sub">
                <i class="fas fa-map-pin" aria-hidden="true"></i>
                Pantau lokasi anak Anda secara <strong>real-time</strong>
            </div>
        </header>

        <!-- ===== INPUT NOMOR HP ===== -->
        <div class="input-card animate-in delay-1">
            <div class="icon-wrap" aria-hidden="true">
                <i class="fas fa-phone-alt"></i>
            </div>
            <input
            type="tel"
            id="phoneInput"
            placeholder="Masukkan nomor HP anak"
            maxlength="16"
            inputmode="numeric"
            autocomplete="tel"
            />
            <button class="btn-track" id="trackBtn">
                <i class="fas fa-search" aria-hidden="true"></i>
                Lacak
            </button>
        </div>

        <!-- ===== STATUS BAR ===== -->
        <div class="status-bar animate-in delay-2">
            <div class="status-item">
                <div class="stat-icon green"><i class="fas fa-wifi" aria-hidden="true"></i></div>
                <div class="stat-info">
                    <div class="stat-label">Provider</div>
                    <div class="stat-value text-ellipsis" id="providerDisplay">—</div>
                </div>
            </div>
            <div class="status-item">
                <div class="stat-icon purple"><i class="fas fa-microchip" aria-hidden="true"></i></div>
                <div class="stat-info">
                    <div class="stat-label">IMEI</div>
                    <div class="stat-value text-ellipsis" id="imeiDisplay">—</div>
                </div>
            </div>
            <div class="status-item">
                <div class="stat-icon blue"><i class="fas fa-satellite-dish" aria-hidden="true"></i></div>
                <div class="stat-info">
                    <div class="stat-label">Status</div>
                    <div class="stat-value" id="statusDisplay">
                        <span class="highlight">● Siap</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== MAP ===== -->
        <div class="map-wrapper animate-in delay-3">
            <div id="map"></div>
            <div class="map-overlay">
                <span class="dot" aria-hidden="true"></span>
                <span id="mapStatus">Menunggu sinyal…</span>
            </div>
        </div>

        <!-- ===== DETAIL KOORDINAT ===== -->
        <div class="detail-grid animate-in delay-4">
            <div class="detail-card accent-coral">
                <div class="label"><i class="fas fa-arrow-up" aria-hidden="true"></i> Latitude</div>
                <div class="value" id="latDisplay">—</div>
            </div>
            <div class="detail-card accent-teal">
                <div class="label"><i class="fas fa-arrow-right" aria-hidden="true"></i> Longitude</div>
                <div class="value" id="lngDisplay">—</div>
            </div>
            <div class="detail-card accent-sunny">
                <div class="label"><i class="fas fa-bullseye" aria-hidden="true"></i> Akurasi</div>
                <div class="value" id="accDisplay">—</div>
            </div>
            <div class="detail-card accent-purple">
                <div class="label"><i class="fas fa-clock" aria-hidden="true"></i> Terakhir</div>
                <div class="value" id="timeDisplay">—</div>
            </div>
        </div>

        <!-- ===== RIWAYAT LOKASI ===== -->
        <div class="history-section animate-in delay-5">
            <div class="history-header">
                <h3><i class="fas fa-history" aria-hidden="true"></i> Riwayat Lokasi</h3>
                <div class="history-actions">
                    <span class="count" id="historyCount">0</span>
                    <button class="btn-clear-history" id="clearHistoryBtn" title="Hapus semua riwayat">
                        <i class="fas fa-trash-alt" aria-hidden="true"></i> Hapus
                    </button>
                </div>
            </div>
            <div class="history-list" id="historyList">
                <div class="history-empty">
                    <i class="fas fa-map-marker-alt" aria-hidden="true"></i>
                    Belum ada riwayat. Mulai pantau untuk mencatat lokasi.
                </div>
            </div>
        </div>

        <!-- ===== TOMBOL KONTROL ===== -->
        <div class="controls animate-in delay-5">
            <button class="btn btn-primary" id="startBtn">
                <i class="fas fa-play" aria-hidden="true"></i> Mulai Pantau
            </button>
            <button class="btn btn-danger" id="stopBtn" disabled>
                <i class="fas fa-stop" aria-hidden="true"></i> Hentikan
            </button>
            <button class="btn btn-outline" id="refreshBtn">
                <i class="fas fa-sync-alt" aria-hidden="true"></i> Refresh
            </button>
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="app-footer">
            <i class="fas fa-heart" aria-hidden="true"></i>
            SafeTrack &bull; Lindungi buah hati Anda
        </div>

        <!-- ===== TOAST ===== -->
        <div class="toast" id="toast" role="alert"></div>
    </div>

    <!-- ============================================================
    JAVASCRIPT — LOGIKA UTAMA
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ------------------------------------------------------------
            // DOM REFS
            // ------------------------------------------------------------
            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);

            const phoneInput = $('#phoneInput');
            const trackBtn = $('#trackBtn');
            const startBtn = $('#startBtn');
            const stopBtn = $('#stopBtn');
            const refreshBtn = $('#refreshBtn');
            const clearHistoryBtn = $('#clearHistoryBtn');

            const providerDisplay = $('#providerDisplay');
            const imeiDisplay = $('#imeiDisplay');
            const statusDisplay = $('#statusDisplay');
            const mapStatus = $('#mapStatus');

            const latDisplay = $('#latDisplay');
            const lngDisplay = $('#lngDisplay');
            const accDisplay = $('#accDisplay');
            const timeDisplay = $('#timeDisplay');

            const historyList = $('#historyList');
            const historyCount = $('#historyCount');
            const toast = $('#toast');

            // ------------------------------------------------------------
            // STATE
            // ------------------------------------------------------------
            let watchId = null;
            let isTracking = false;
            let history = [];
            let currentPosition = null;
            let map = null;
            let marker = null;
            let circle = null;
            let lastPhoneNumber = '';

            // ------------------------------------------------------------
            // MOCK DATA (simulasi provider & IMEI)
            // ------------------------------------------------------------
            const PROVIDERS = ['Telkomsel', 'Indosat', 'XL Axiata', 'Smartfren', 'Three', 'By.U'];

            function getRandomProvider() {
                return PROVIDERS[Math.floor(Math.random() * PROVIDERS.length)];
            }

            // Generate IMEI valid (15 digit, dengan check digit Luhn sederhana)
            function generateIMEI() {
                const base = '35' + String(Math.floor(Math.random() * 1000000000000)).padStart(12, '0');
                let sum = 0;
                let alternate = true;
                for (let i = base.length - 1; i >= 0; i--) {
                    let n = parseInt(base[i], 10);
                    if (alternate) {
                        n *= 2;
                        if (n > 9) n -= 9;
                    }
                    sum += n;
                    alternate = !alternate;
                }
                const check = (10 - (sum % 10)) % 10;
                return base + check;
            }

            const mockIMEI = generateIMEI();

            // ------------------------------------------------------------
            // TOAST
            // ------------------------------------------------------------
            let toastTimer = null;

            function showToast(message, type = 'info', duration = 3000) {
                if (toastTimer) {
                    clearTimeout(toastTimer);
                    toast.classList.remove('show');
                }
                toast.textContent = message;
                toast.className = 'toast';
                if (type === 'success') toast.classList.add('success');
                else if (type === 'error') toast.classList.add('error');
                else if (type === 'warning') toast.classList.add('warning');
                // force reflow
                void toast.offsetWidth;
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, duration);
            }

            // ------------------------------------------------------------
            // FORMAT WAKTU
            // ------------------------------------------------------------
            function formatTime(ts) {
                const d = new Date(ts);
                return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            }

            function formatDate(ts) {
                const d = new Date(ts);
                return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
            }

            function formatFullTime(ts) {
                return formatDate(ts) + ' ' + formatTime(ts);
            }

            // ------------------------------------------------------------
            // UPDATE UI POSISI
            // ------------------------------------------------------------
            function updatePositionUI(pos) {
                if (!pos) return;
                const { latitude, longitude, accuracy } = pos.coords;
                const timestamp = pos.timestamp;

                currentPosition = pos;

                latDisplay.textContent = latitude.toFixed(6);
                lngDisplay.textContent = longitude.toFixed(6);
                accDisplay.textContent = accuracy ? accuracy.toFixed(0) + ' m' : '—';
                timeDisplay.textContent = formatFullTime(timestamp);

                // Update map
                if (map && marker) {
                    const latlng = [latitude, longitude];
                    marker.setLatLng(latlng);
                    if (circle) {
                        circle.setLatLng(latlng);
                        if (accuracy && accuracy < 1000) {
                            circle.setRadius(accuracy);
                        } else {
                            circle.setRadius(50);
                        }
                    }
                    map.setView(latlng, 16, { animate: true });
                }

                // Status
                statusDisplay.innerHTML = `<span class="highlight">● Terpantau</span>`;
                mapStatus.textContent = 'Lokasi real-time';

                // Tambah riwayat
                addHistory(latitude, longitude, accuracy, timestamp);
            }

            // ------------------------------------------------------------
            // RIWAYAT
            // ------------------------------------------------------------
            function addHistory(lat, lng, acc, ts) {
                const entry = {
                    lat: lat,
                    lng: lng,
                    acc: acc,
                    time: ts,
                    formatted: formatFullTime(ts)
                };
                history.push(entry);
                if (history.length > 100) history.shift(); // batas 100
                renderHistory();
            }

            function renderHistory() {
                historyCount.textContent = history.length;

                if (history.length === 0) {
                    historyList.innerHTML = `
                        <div class="history-empty">
                            <i class="fas fa-map-marker-alt" aria-hidden="true"></i>
                            Belum ada riwayat. Mulai pantau untuk mencatat lokasi.
                        </div>
                    `;
                    return;
                }

                let html = '';
                // Tampilkan terbaru di atas
                const reversed = [...history].reverse();
                for (const item of reversed) {
                    const statusIcon = (item.acc && item.acc < 60) ? '✅' : '📍';
                    html += `
                        <div class="history-item">
                            <span class="h-time">${item.formatted}</span>
                            <span class="h-coord">${item.lat.toFixed(5)}, ${item.lng.toFixed(5)}</span>
                            <span class="h-status">${statusIcon}</span>
                        </div>
                    `;
                }
                historyList.innerHTML = html;
            }

            function clearHistory() {
                if (history.length === 0) {
                    showToast('ℹ️ Riwayat sudah kosong.', 'info', 1500);
                    return;
                }
                history = [];
                renderHistory();
                showToast('🗑️ Riwayat berhasil dihapus.', 'success', 1500);
            }

            // ------------------------------------------------------------
            // GEOLOKASI — MULAI & HENTIKAN
            // ------------------------------------------------------------
            function startTracking() {
                if (isTracking) return;

                if (!navigator.geolocation) {
                    showToast('❌ Browser tidak mendukung GPS. Gunakan Chrome/Android.', 'error', 4000);
                    return;
                }

                // Set provider & IMEI (simulasi)
                providerDisplay.textContent = getRandomProvider();
                imeiDisplay.textContent = mockIMEI;

                statusDisplay.innerHTML = `<span class="highlight">⏳ Mengambil lokasi…</span>`;
                mapStatus.textContent = 'Mencari sinyal GPS…';
                showToast('📡 Mengakses GPS perangkat…', 'info', 2000);

                const geoOptions = {
                    enableHighAccuracy: true,
                    timeout: 20000,
                    maximumAge: 5000
                };

                watchId = navigator.geolocation.watchPosition(
                    // success
                    (pos) => {
                        updatePositionUI(pos);
                        if (!isTracking) {
                            isTracking = true;
                            updateButtons();
                            showToast('✅ Pelacakan real-time aktif!', 'success');
                            // Simpan nomor jika ada
                            const phone = phoneInput.value.trim();
                            if (phone) lastPhoneNumber = phone;
                        }
                    },
                    // error
                    (err) => {
                        console.error('Geolocation error:', err);
                        let msg = '❌ Gagal mengakses GPS. ';
                        switch (err.code) {
                            case err.PERMISSION_DENIED:
                                msg += 'Izin lokasi ditolak. Aktifkan di pengaturan perangkat.';
                                break;
                            case err.POSITION_UNAVAILABLE:
                                msg += 'Sinyal GPS tidak tersedia. Coba di luar ruangan.';
                                break;
                            case err.TIMEOUT:
                                msg += 'Waktu habis. Pastikan GPS aktif.';
                                break;
                            default:
                                msg += err.message || 'Error tidak diketahui.';
                        }
                        showToast(msg, 'error', 4500);
                        statusDisplay.innerHTML = `<span class="danger">● Gagal</span>`;
                        mapStatus.textContent = '⛔ Tidak tersedia';
                        stopTracking();
                    },
                    geoOptions
                );

                // Fallback jika watchPosition tidak merespon dalam 4 detik
                setTimeout(() => {
                    if (!isTracking && watchId !== null) {
                        // masih menunggu
                    }
                }, 4000);
            }

            function stopTracking() {
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }
                isTracking = false;
                updateButtons();
                statusDisplay.innerHTML = `<span style="color:var(--gray);">● Berhenti</span>`;
                mapStatus.textContent = 'Pelacakan dihentikan';
                showToast('⏹️ Pelacakan dihentikan.', 'info', 1500);
            }

            function refreshLocation() {
                if (isTracking) {
                    showToast('🔄 Memperbarui lokasi…', 'info', 1000);
                    // Restart watch untuk refresh
                    stopTracking();
                    setTimeout(() => {
                        startTracking();
                    }, 350);
                } else {
                    showToast('⚠️ Mulai pelacakan terlebih dahulu.', 'warning');
                }
            }

            // ------------------------------------------------------------
            // UPDATE TOMBOL
            // ------------------------------------------------------------
            function updateButtons() {
                if (isTracking) {
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    trackBtn.disabled = true;
                    startBtn.innerHTML = `<i class="fas fa-spinner fa-spin" aria-hidden="true"></i> Memantau`;
                } else {
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    trackBtn.disabled = false;
                    startBtn.innerHTML = `<i class="fas fa-play" aria-hidden="true"></i> Mulai Pantau`;
                }
            }

            // ------------------------------------------------------------
            // INISIALISASI MAP (Leaflet)
            // ------------------------------------------------------------
            function initMap() {
                const mapContainer = document.getElementById('map');
                const defaultCenter = [-6.2088, 106.8456]; // Jakarta

                map = L.map(mapContainer, {
                    center: defaultCenter,
                    zoom: 14,
                    zoomControl: false,
                    attributionControl: true
                });

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a>'
                }).addTo(map);

                // Zoom control di kanan bawah
                L.control.zoom({
                    position: 'bottomright'
                }).addTo(map);

                // Marker kustom dengan emoji
                const iconHtml = `
                    <div style="
                        background: #4ECDC4;
                        width: 44px;
                        height: 44px;
                        border-radius: 50%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font-size: 24px;
                        border: 3px solid white;
                        box-shadow: 0 4px 16px rgba(78,205,196,0.55);
                        transform: translate(-50%, -50%);
                        transition: 0.2s;
                    ">
                        👶
                    </div>
                `;
                const customIcon = L.divIcon({
                    html: iconHtml,
                    className: '',
                    iconSize: [44, 44],
                    iconAnchor: [22, 22]
                });

                marker = L.marker(defaultCenter, {
                    icon: customIcon,
                    draggable: false
                }).addTo(map);

                // Circle akurasi
                circle = L.circle(defaultCenter, {
                    radius: 50,
                    color: '#4ECDC4',
                    fillColor: '#4ECDC4',
                    fillOpacity: 0.15,
                    weight: 2,
                    opacity: 0.7
                }).addTo(map);

                // Klik map → info toast
                map.on('click', function(e) {
                    showToast(`📍 ${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`, 'info', 2000);
                });

                // Resize map setelah render
                setTimeout(() => {
                    map.invalidateSize();
                }, 400);

                // Coba posisi awal (tanpa memulai tracking)
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            const { latitude, longitude } = pos.coords;
                            const latlng = [latitude, longitude];
                            map.setView(latlng, 15);
                            marker.setLatLng(latlng);
                            circle.setLatLng(latlng);
                            if (pos.coords.accuracy) {
                                circle.setRadius(pos.coords.accuracy);
                            }
                            updatePositionUI(pos);
                            providerDisplay.textContent = getRandomProvider();
                            imeiDisplay.textContent = mockIMEI;
                            statusDisplay.innerHTML = `<span class="highlight">● Siap</span>`;
                            mapStatus.textContent = 'GPS siap';
                        },
                        () => {
                            // fallback ke default
                            showToast('📍 Gunakan lokasi default. Aktifkan GPS untuk akurasi.', 'warning', 3000);
                            mapStatus.textContent = 'Lokasi default';
                        }, { enableHighAccuracy: true, timeout: 8000 }
                    );
                }
            }

            // ------------------------------------------------------------
            // EVENT HANDLERS
            // ------------------------------------------------------------
            // Tombol "Lacak" (dari input nomor)
            trackBtn.addEventListener('click', function() {
                const phone = phoneInput.value.trim();
                if (!phone) {
                    showToast('📱 Masukkan nomor HP anak terlebih dahulu.', 'warning');
                    phoneInput.focus();
                    return;
                }
                if (phone.length < 8) {
                    showToast('⚠️ Nomor HP tidak valid (minimal 8 digit).', 'warning');
                    return;
                }
                lastPhoneNumber = phone;
                showToast(`🔍 Melacak nomor ${phone}…`, 'info', 1500);

                // Simulasi koneksi provider
                providerDisplay.textContent = getRandomProvider();
                imeiDisplay.textContent = mockIMEI;

                if (!isTracking) {
                    startTracking();
                } else {
                    refreshLocation();
                }
            });

            // Enter pada input phone
            phoneInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    trackBtn.click();
                }
            });

            startBtn.addEventListener('click', startTracking);
            stopBtn.addEventListener('click', stopTracking);
            refreshBtn.addEventListener('click', refreshLocation);
            clearHistoryBtn.addEventListener('click', clearHistory);

            // ------------------------------------------------------------
            // INIT
            // ------------------------------------------------------------
            function init() {
                initMap();
                updateButtons();

                // Set default IMEI & provider (simulasi)
                imeiDisplay.textContent = mockIMEI;
                providerDisplay.textContent = getRandomProvider();

                // Cek dukungan geolokasi
                if (!navigator.geolocation) {
                    showToast('❌ Browser tidak mendukung GPS. Gunakan Chrome/Android.', 'error', 5000);
                    statusDisplay.innerHTML = `<span class="danger">● Tidak didukung</span>`;
                    mapStatus.textContent = '⛔ GPS tidak tersedia';
                }

                console.log('👶 SafeTrack siap. IMEI:', mockIMEI);
                console.log('📱 Aplikasi pelacakan anak — real-time GPS');
                console.log('💡 Masukkan nomor HP anak, lalu tekan "Lacak"');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
